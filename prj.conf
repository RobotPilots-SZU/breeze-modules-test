CONFIG_CPP=y
CONFIG_STD_CPP20=y

CONFIG_BREEZE=y
CONFIG_BREEZE_MODULES=y
CONFIG_BREEZE_MODULE_MSGPIPE=y
CONFIG_BREEZE_MODULE_REFEREE=y
CONFIG_ALGO=y
CONFIG_ALGO_ENABLE_ARM_MATH=n

CONFIG_SERIAL=y
CONFIG_RP_UART_STM32=y
CONFIG_UART_STM32=n
CONFIG_UART_ASYNC_API=y
CONFIG_DCACHE=n
CONFIG_NOCACHE_MEMORY=y

# 接收线程栈（解析 + zbus listener）
CONFIG_BREEZE_MODULE_REFEREE_RX_THREAD_STACK_SIZE=1024

# RTT / VOFA+
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=3
CONFIG_SEGGER_RTT_MAX_NUM_DOWN_BUFFERS=2

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096

CONFIG_DEBUG_OPTIMIZATIONS=y
